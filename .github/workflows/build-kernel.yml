name: Build and release kernel and SDK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dfm.ko for ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-20260828
      options: --privileged
    defaults:
      run:
        shell: bash
    env:
      KMI: ${{ matrix.kmi }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build kernel module
        run: |
          set -euo pipefail
          make -j"$(nproc)" KDIR="${KERNEL_SRC:?KERNEL_SRC is not set}"
          test -s dfm.ko

      - name: Prepare kernel artifact
        run: |
          set -euo pipefail
          mkdir -p out
          output="dfm-${KMI}.ko"
          cp dfm.ko "out/$output"
          llvm-strip --strip-debug "out/$output"
          test -s "out/$output"
          cd out
          sha256sum "$output" > "$output.sha256"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: dfm-kernel-${{ matrix.kmi }}
          path: |
            out/dfm-${{ matrix.kmi }}.ko
            out/dfm-${{ matrix.kmi }}.ko.sha256
          if-no-files-found: error
          retention-days: 30

  sdk:
    name: Build Android arm64 SDK and loader
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and install SDK
        run: |
          set -euo pipefail
          cmake -S . -B build/sdk -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
          cmake --build build/sdk --parallel "$(nproc)"
          cmake --install build/sdk --prefix "$PWD/out/enkernel-sdk-arm64-v8a"

      - name: Verify installed SDK integration
        run: |
          set -euo pipefail
          cmake -S out/enkernel-sdk-arm64-v8a/examples -B build/consumer -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -Denkernel_DIR="$PWD/out/enkernel-sdk-arm64-v8a/lib/cmake/enkernel"
          cmake --build build/consumer --parallel "$(nproc)"

      - name: Upload SDK, loader and calling example
        uses: actions/upload-artifact@v4
        with:
          name: enkernel-sdk-arm64-v8a
          path: out/enkernel-sdk-arm64-v8a/
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package and publish release
    needs: [build, sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download SDK
        uses: actions/download-artifact@v4
        with:
          name: enkernel-sdk-arm64-v8a
          path: out/enkernel-arm64-v8a

      - name: Download kernel modules
        uses: actions/download-artifact@v4
        with:
          pattern: dfm-kernel-*
          merge-multiple: true
          path: out/enkernel-arm64-v8a/modules

      - name: Verify modules and create distribution archive
        run: |
          set -euo pipefail
          for kmi in android12-5.10 android13-5.15 android14-6.1 android15-6.6 android16-6.12 android17-6.18; do
            (cd out/enkernel-arm64-v8a/modules && sha256sum --check "dfm-$kmi.ko.sha256")
          done
          # Artifact ZIPs do not preserve executable permissions; the tarball does.
          chmod 755 out/enkernel-arm64-v8a/bin/dfm_loader out/enkernel-arm64-v8a/bin/dfm_example
          tar -C out/enkernel-arm64-v8a --exclude=./modules \
            -czf out/enkernel-sdk-arm64-v8a.tar.gz .
          tar -C out -czf out/enkernel-arm64-v8a.tar.gz enkernel-arm64-v8a
          cd out
          sha256sum enkernel-sdk-arm64-v8a.tar.gz > enkernel-sdk-arm64-v8a.tar.gz.sha256
          sha256sum enkernel-arm64-v8a.tar.gz > enkernel-arm64-v8a.tar.gz.sha256

      - name: Upload pull request distribution
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: enkernel-arm64-v8a
          path: |
            out/enkernel-arm64-v8a.tar.gz
            out/enkernel-arm64-v8a.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create draft release
        if: github.event_name != 'pull_request'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_name="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          # Include the run and attempt so same-day builds and retries cannot collide.
          release_tag="$(date -u -d "$release_name" '+%Y-%m-%d-%H%M%S')-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_id="$(
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$release_tag" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$release_name" \
              -f body="Built from ${GITHUB_SHA}. Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." \
              -F draft=true \
              --jq '.id'
          )"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload, verify and publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          files=(
            out/*.tar.gz
            out/*.tar.gz.sha256
            out/enkernel-arm64-v8a/modules/*.ko
            out/enkernel-arm64-v8a/modules/*.ko.sha256
          )
          gh release upload "$RELEASE_TAG" "${files[@]}"

          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --paginate --jq '.[] | [.name, .size] | @tsv')"
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            expected_size="$(stat -c %s "$file")"
            actual_size="$(printf '%s\n' "$assets" | awk -v name="$name" '$1 == name {print $2}')"
            if [ "$expected_size" -le 0 ] || [ "$actual_size" != "$expected_size" ]; then
              echo "Release asset missing or size mismatch: $name" >&2
              exit 1
            fi
          done

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true >/dev/null

      - name: Delete incomplete release
        if: ${{ (failure() || cancelled()) && steps.release.outputs.release_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          # A failed response after publishing must not delete a complete release.
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft')"
          if [ "$draft" = true ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" || true
          fi
